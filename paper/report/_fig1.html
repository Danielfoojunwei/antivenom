<figure class="ov">
 <div class="band bio"><h4>🐍 How antivenom works</h4>
  <div class="row5">
   <div class="cc"><span class="em">🐍💧</span><b>Venom spreads</b>through the blood and acts wherever it lands</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🧪</span><b>Capture a sample</b>a small amount of venom is collected</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🐴🧬</span><b>Raise antibodies</b>that recognise the toxin's <i>shape</i>, not the snake</div><div class="ar">➜</div>
   <div class="cc"><span class="em">💉🩸</span><b>Circulate</b>antibodies bind and neutralise toxin anywhere in the body</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🩺</span><b>Treat on symptoms</b>given only when envenoming shows: it has side effects</div>
  </div></div>
 <div class="insp"><span>⇣ inspires</span><span>⇣</span><span>⇣</span><span>⇣</span><span>⇣</span></div>
 <div class="band sw"><h4>🤖 How AntiVenom protects a swarm</h4>
  <div class="row5">
   <div class="cc"><span class="em">🗄️☠️</span><b>Poison spreads</b>planted records reach every agent, as copies under different IDs</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🕵️🔎</span><b>Catch one record</b>one agent spots one planted record</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🧾✨</span><b>Distil a claim signature</b>question + false claim, ≈ 250 bytes; meaning, not ID</div><div class="ar">➜</div>
   <div class="cc"><span class="em">📡🤖🤖🤖</span><b>Broadcast</b>each agent removes passages that assert the claim, refills, answers</div><div class="ar">➜</div>
   <div class="cc"><span class="em">🚦</span><b>Act only on the claim</b>agents intervene only when a passage entails it</div>
  </div></div>
 <div class="lanes">
  <div class="lane bad"><h4>❌ Without AntiVenom</h4>
   <div class="chain"><span class="ic">👤</span><div class="bub">“What is the main industry in the Canadian Shield?”</div></div>
   <div class="chain" style="margin-top:1.4mm"><span class="ic">🤖</span><div class="bub">Retrieved: <span class="docs">📕📕📕📕📕📗📗📗📗📗</span><br>“…its primary income sector is <span class="red">not mining but rather fishing</span>…”</div></div>
   <div class="chain" style="margin-top:1.4mm"><span class="ic">💬</span><div class="bub">Answer: <span class="red">“Fishing.”</span> &nbsp;Copies under other IDs fool the rest of the swarm too.</div></div>
  </div>
  <div class="lane good"><h4>✅ With AntiVenom</h4>
   <div class="chain"><span class="ic">📡</span><div class="bub">Signature received: <i>“main industry of the Canadian Shield” → <span class="red">fishing</span></i></div></div>
   <div class="chain" style="margin-top:1.4mm"><span class="ic">🛡️</span><div class="bub">Checks: <span class="docs"><span class="strike">📕📕📕📕</span></span> entail the claim; <span class="docs"><span class="strike">📕</span></span> caught by attention; <span class="docs">📗📗📗📗📗</span> kept</div></div>
   <div class="chain" style="margin-top:1.4mm"><span class="ic">💬</span><div class="bub">Answer: <span class="grn">“Mining is the main industry in the Canadian Shield.”</span></div></div>
  </div>
 </div>
</figure>
<p class="cap"><b>Figure 1:</b> From antivenom to AntiVenom. Top: how antivenom works. Middle: the design each step inspired. Bottom: a real development question (NQ test363) with and without AntiVenom (📕 planted record, 📗 clean record); values are those of Figure 3.</p>
