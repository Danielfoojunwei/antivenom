[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antivenom-tool"
version = "0.1.0"
description = "Turn one caught poisoned record into a shareable claim signature that protects every agent's retrieved context."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
nli = ["sentence-transformers>=2.2"]

[project.scripts]
antivenom = "antivenom_tool.cli:main"

[tool.setuptools]
packages = ["antivenom_tool"]
